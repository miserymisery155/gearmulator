name: Build 88emuPlayer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Gearmulator
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: |
          cmake --preset windows-x64 `
            -Dgearmulator_BUILD_JUCEPLUGIN=ON

      - name: Show generated targets
        run: |
          cmake --build temp/cmake_windows-x64 --target help

      - name: Build 88emuPlayer
        run: |
          cmake --build temp/cmake_windows-x64 --target 88emuplayer_Standalone --parallel 4

      - name: Find executable
        shell: pwsh
        run: |
          Write-Host "Looking for 88emuPlayer.exe..."
          Get-ChildItem -Path . -Recurse -Filter "88emuPlayer*.exe" |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Upload 88emuPlayer
        uses: actions/upload-artifact@v4
        with:
          name: 88emuPlayer-windows
          path: |
            **/88emuPlayer*.exe
          if-no-files-found: error
