name: Build 88emuplayer
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: List targets
        run: cmake --build build --target help

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: 88emuplayer-windows
          path: |
            bin/plugins/**/88emuPlayer*.exe
            build/**/88emuPlayer*.exe
